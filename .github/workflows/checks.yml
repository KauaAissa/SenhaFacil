name: Base Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://senha_facil:senha_facil@localhost:5432/senha_facil?schema=public
      EXPO_PUBLIC_API_URL: http://localhost:3000
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @senha-facil/api db:generate
      - run: pnpm typecheck
      - run: pnpm test:crypto
      - run: pnpm --filter @senha-facil/mobile build:android:bundle